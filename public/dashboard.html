<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - NoaSoft MMO</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card glass">
    <h1>Commander Dashboard</h1>
    <div id="stats" class="muted">Loading profile...</div>
    <div class="btn-row">
      <button id="openMap" class="primary-btn">Open Map</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/login';

function toast(msg, error=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${error ? 'error' : ''}`;
  setTimeout(()=> t.className='toast', 2400);
}

async function loadProfile(){
  try {
    const res = await fetch('/api/player/me', { headers:{ Authorization: `Bearer ${token}` } });
    const data = await res.json();
    if (!res.ok || !data.data) {
      localStorage.removeItem('token');
      location.href = '/login';
      return;
    }
    const p = data.data;
    stats.innerHTML = `
      <p><b>${p.username}</b></p>
      <p>Level: ${p.level ?? 1}</p>
      <p>Gold: ${p.gold ?? 0}</p>
      <p>Energy: ${p.energy}</p>
      <p>Current Region: ${p.current_region_name}</p>
    `;
  } catch {
    toast('Failed to load dashboard', true);
    stats.textContent = 'Unable to load profile.';
  }
}

openMap.onclick = ()=> location.href = '/map';
logoutBtn.onclick = ()=> { localStorage.removeItem('token'); location.href = '/login'; };
loadProfile();
</script>
</body>
</html>
