<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - NoaSoft MMO</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card glass">
    <h1>Commander Dashboard</h1>
    <div id="stats" class="muted">Loading profile...</div>
    <div class="bar"><div id="xpBar" class="bar-fill"></div></div>
    <small id="xpText" class="muted"></small>
    <div class="bar"><div id="energyBar" class="bar-fill energy"></div></div>
    <small id="energyText" class="muted"></small>
    <div class="btn-row">
      <button id="openMap" class="primary-btn">Open Map</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
function toast(msg, error=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${error ? 'error' : ''}`;
  setTimeout(()=> t.className='toast', 2400);
}

async function loadProfile(){
  try {
    const res = await fetch('/api/player/me');
    const data = await res.json();
    if (!res.ok || !data.data) {
      location.href = '/login';
      return;
    }
    const p = data.data;
    stats.innerHTML = `
      <p><b>${p.username}</b></p>
      <p>Level: ${p.level}</p>
      <p>Gold: ${Number(p.gold).toFixed(2)} | Coins: ${Number(p.coins).toFixed(2)}</p>
      <p>Current Region: ${p.current_region_name}</p>
    `;
    const xpPct = Math.min(100, Math.round((p.xp / p.xp_to_next) * 100));
    xpBar.style.width = `${xpPct}%`;
    xpText.textContent = `XP ${p.xp}/${p.xp_to_next} (${xpPct}%)`;
    const energyPct = Math.min(100, Math.round((p.energy / p.max_energy) * 100));
    energyBar.style.width = `${energyPct}%`;
    energyText.textContent = `Energy ${p.energy}/${p.max_energy}`;
  } catch {
    toast('Failed to load dashboard', true);
    stats.textContent = 'Unable to load profile.';
  }
}

openMap.onclick = ()=> location.href = '/map';
logoutBtn.onclick = async ()=> {
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = '/login';
};
loadProfile();
</script>
</body>
</html>
