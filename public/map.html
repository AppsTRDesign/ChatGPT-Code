<!doctype html>
<html>
<head>
<meta charset="utf-8"><title>World Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="map"></div>
<div id="toast" class="toast"></div>
<div id="sheet" class="action-sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="closeSheet">×</button>
  <h3 id="regionTitle">Region</h3>
  <p id="regionMeta"></p>
  <p id="modeHint" class="muted"></p>
  <button id="travelBtn" class="primary-btn">Travel to this region</button>
</div>
<div class="map-nav">
  <a class="map-back" href="/dashboard" id="dashLink">Dashboard</a>
  <a class="map-back" href="/login" id="loginLink" style="display:none">Login</a>
  <a class="map-back" href="/register" id="registerLink" style="left:120px;display:none">Register</a>
</div>
<script>
let selectedRegion = null;
let me = null;
const token = localStorage.getItem('token');
const isAuthed = !!token;
const layers = new Map();
let currentRegionId = null;
let selectedRegionId = null;
let marker = null;
let isActing = false;

const map = L.map('map').setView([20,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OSM'}).addTo(map);
const sheet = document.getElementById('sheet');
const toastEl = document.getElementById('toast');

if (!isAuthed) {
  dashLink.style.display = 'none';
  loginLink.style.display = 'inline-block';
  registerLink.style.display = 'inline-block';
}

async function api(url, opts={}){
  opts.headers = {...(opts.headers||{})};
  if (token) opts.headers.Authorization = `Bearer ${token}`;
  const r = await fetch(url,opts);
  return r.json();
}

function showToast(message, error=false){
  toastEl.textContent = message;
  toastEl.className = `toast show ${error ? 'error' : ''}`;
  setTimeout(()=> toastEl.className = 'toast', 2200);
}

function openSheet(region){
  selectedRegion = region;
  selectedRegionId = Number(region.id);
  regionTitle.textContent = `${region.name}, ${region.country_name}`;
  regionMeta.innerHTML = `Owner: ${region.owner_country_name || region.country_name}<br>Resource: ${region.resource_type}<br>Population: ${region.population}`;
  modeHint.textContent = isAuthed ? '' : 'Login to interact with this region.';
  travelBtn.disabled = !isAuthed || isActing || currentRegionId === Number(region.id);
  sheet.classList.add('open');
  refreshStyles();
}

function closeSheet(){
  sheet.classList.remove('open');
  selectedRegionId = null;
  refreshStyles();
}

function styleFor(region){
  const id = Number(region.id);
  const isCurrent = currentRegionId === id;
  const isSelected = selectedRegionId === id;
  return {
    color: isSelected ? '#ffffff' : region.country_color,
    fillColor: region.country_color,
    fillOpacity: isCurrent ? 0.75 : 0.38,
    weight: isCurrent ? 3 : (isSelected ? 3 : 1)
  };
}

function refreshStyles(){
  layers.forEach((obj)=> obj.layer.setStyle(styleFor(obj.region)));
}

async function load(){
  if (isAuthed) {
    const meRes = await api('/api/player/me');
    if (meRes.data) {
      me = meRes.data;
      currentRegionId = Number(me.current_region_id);
    }
  }

  const regions = (await fetch('/api/map/regions').then(r=>r.json())).data || [];
  regions.forEach(region=>{
    const geo = JSON.parse(region.polygon_json);
    const layer = L.geoJSON(geo,{style: styleFor(region)}).addTo(map);
    layer.on('click',()=> openSheet(region));
    layers.set(Number(region.id),{layer,region});
  });

  if (isAuthed && currentRegionId) {
    const current = regions.find(r=>Number(r.id)===currentRegionId);
    marker = L.circleMarker([current?.lat || 0, current?.lng || 0],{radius:8,color:'#fff',fillColor:'#0ea5e9',fillOpacity:1}).addTo(map);
    if (current) map.setView([current.lat,current.lng],5);
  }
}

travelBtn.onclick = async ()=>{
  if (!isAuthed) { showToast('Please login first', true); return; }
  if(!selectedRegion || isActing) return;
  isActing = true;
  travelBtn.textContent = 'Traveling...';
  travelBtn.disabled = true;

  const result = await api('/api/region/action',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({region_id:selectedRegion.id, action:'travel'})
  });

  if(result.error){
    showToast(result.error, true);
  } else {
    currentRegionId = Number(result.new_region_id);
    const currentRegion = layers.get(currentRegionId)?.region;
    if(currentRegion && marker){
      marker.setLatLng([currentRegion.lat,currentRegion.lng]);
      map.panTo([currentRegion.lat,currentRegion.lng]);
    }
    refreshStyles();
    closeSheet();
    showToast(result.message || 'Action completed');
  }

  isActing = false;
  travelBtn.textContent = 'Travel to this region';
  travelBtn.disabled = !isAuthed || (selectedRegion && currentRegionId === Number(selectedRegion.id));
};

closeSheet.onclick = closeSheet;
load();
</script>
</body></html>
