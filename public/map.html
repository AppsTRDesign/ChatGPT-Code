<!doctype html>
<html>
<head>
<meta charset="utf-8"><title>World Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="map"></div>
<div class="map-panel">
  <h3>Region Info</h3>
  <div id="regionInfo">Click a region.</div>
  <button id="travelBtn" disabled>Travel Here</button>
  <p><a href="/dashboard.html">Back dashboard</a></p>
</div>
<script>
let selectedRegion = null, me = null, token = localStorage.getItem('token');
if(!token) location.href='/login.html';
const map = L.map('map').setView([20,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OSM'}).addTo(map);
let marker;
async function api(url, opts={}){
  opts.headers = {...(opts.headers||{}), Authorization:`Bearer ${token}`};
  const r = await fetch(url,opts); return r.json();
}
async function load(){
  me = (await api('/api/player/me')).data;
  const regions = (await fetch('/api/map/regions').then(r=>r.json())).data;
  regions.forEach(region=>{
    const geo = JSON.parse(region.polygon_json);
    const layer = L.geoJSON(geo,{style:{color: region.country_color, fillColor: region.country_color, fillOpacity:0.4, weight: me.current_region_id==region.id?3:1}}).addTo(map);
    layer.on('click',()=>{
      selectedRegion = region;
      regionInfo.innerHTML = `<b>${region.name}</b><br>Country: ${region.country_name}<br>Owner: ${region.owner_country_name||region.country_name}<br>Resource: ${region.resource_type}`;
      travelBtn.disabled = me.current_region_id == region.id;
    });
  });
  marker = L.circleMarker([me.current_region_lat || 0, me.current_region_lng || 0],{radius:8,color:'#fff'}).addTo(map);
  const current = regions.find(r=>r.id==me.current_region_id);
  if(current){ marker.setLatLng([current.lat,current.lng]); map.setView([current.lat,current.lng],5); }
}
travelBtn.onclick = async ()=>{
  if(!selectedRegion) return;
  const res = await api('/api/player/travel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to_region_id:selectedRegion.id})});
  if(res.error){ alert(res.error); return; }
  alert('Travel completed'); location.reload();
};
load();
</script>
</body></html>
