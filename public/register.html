<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - NoaSoft MMO</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card glass">
      <h1>Create Account</h1>
      <p class="muted">Join the geopolitical simulation.</p>
      <input id="username" type="text" placeholder="Username">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password (8+ chars)">
      <button id="registerBtn" class="primary-btn">Create account</button>
      <p class="muted">Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
<script>
if (localStorage.getItem('token')) location.href = '/map';

function toast(msg, error=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${error ? 'error' : ''}`;
  setTimeout(()=> t.className='toast', 2400);
}

registerBtn.onclick = async () => {
  const btn = registerBtn;
  btn.disabled = true;
  btn.textContent = 'Creating...';
  try {
    const res = await fetch('/api/auth/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.value.trim(), email: email.value.trim(), password: password.value })
    });
    const data = await res.json();
    if (!res.ok || !data.token) {
      toast(data.error || 'Registration failed', true);
      return;
    }
    localStorage.setItem('token', data.token);
    toast('Account created');
    setTimeout(()=> location.href='/dashboard', 450);
  } catch {
    toast('Network error', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
};
</script>
</body>
</html>
